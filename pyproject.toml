[project]
name = "arabic-toxicity-dialects"
version = "0.1.0"
description = "Dialect-aware Arabic toxicity detection with TF-IDF/SVM, QARiB, and Jais-2."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "datasets>=3.0",
  "transformers>=4.48",
  "torch>=2.4",
  "accelerate>=1.0",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "streamlit>=1.40"
]

[project.optional-dependencies]
jais-api = ["openai>=1.50"]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
